name: Bootstrap source import

on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source-import.part-* > source-import.tar.xz
          echo "442a1600b615c447407bb07960abb6f3461a5041c6d35382cdefa9f2620c0165  source-import.tar.xz" | sha256sum -c -
          tar -xJf source-import.tar.xz

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f source-import.tar.xz
          git rm -r .bootstrap
          git rm .github/workflows/bootstrap-import.yml
          git add setup.go installer.ps1 install-worker.ps1 projectdb-tray.cs projectdb-service-control.cs projectdb-log-wrapper.cs payload/projectdb.ico
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import ProjectDB Service Manager source"
          git push origin HEAD:main
